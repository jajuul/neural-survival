# Dependency audit run by scripts/review-gate.sh: known vulnerabilities,
# licences, and crate sources.

[advisories]
# Unmaintained transitive crates (deep in the GUI stack) aren't actionable here.
unmaintained = "workspace"

[licenses]
# Our own crates are never published and have no licence field.
private = { ignore = true }
# Permissive licences, plus the fonts egui bundles (OFL-1.1, Ubuntu-font-1.0).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
