[package]
name = "neural-survival"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
bevy = { version = "0.15", optional = true }
clap = { version = "4", features = ["derive"] }
csv = "1"
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
toml = "0.8"

[features]
default = []
gui = ["dep:bevy"]
