[workspace]
members = [".", "crates/core", "crates/viewer"]
default-members = [".", "crates/core", "crates/viewer"]
resolver = "3"

[package]
name = "neural-survival"
version = "0.1.0"
edition = "2024"

[dependencies]
neural-survival-core = { path = "crates/core" }
neural-survival-viewer = { path = "crates/viewer" }
clap = { version = "4.5", features = ["derive"] }
rand = "0.8"

[dev-dependencies]
proptest = "1"
tempfile = "3"
